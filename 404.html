<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Planlı Bakım</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071b33'/%3E%3Cpath d='M32 7 53 19v26L32 57 11 45V19Z' fill='none' stroke='%23d4af37' stroke-width='4'/%3E%3Cpath d='M20 43V21l12 13 12-13v22' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--lacivert:#071b33;--altin:#d4af37;--metin:#111c2e;--soluk:#526075;--kenar:#dce3ec;--zemin:#f7f8fa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--metin);background:var(--zemin);display:flex;flex-direction:column;min-height:100vh}
.ust{height:64px;background:var(--lacivert);border-bottom:2px solid var(--altin);color:#fff}
.gen{width:min(1080px,calc(100% - 32px));margin:auto}
.ust .gen{height:100%;display:flex;align-items:center;justify-content:space-between}
.marka{font-weight:900;letter-spacing:.08em;font-size:15px}
.marka i{font-style:normal;color:var(--altin)}
.urun{font-size:13px;font-weight:700;letter-spacing:.06em;color:#c9d3e2}
.ana{flex:1;display:grid;place-items:center;padding:40px 0}
.kutu{width:min(640px,calc(100% - 32px));background:#fff;border:1px solid var(--kenar);border-top:3px solid var(--altin);border-radius:8px;padding:40px 40px 32px;box-shadow:0 10px 30px rgba(7,27,51,.08)}
.etiket{font-size:12px;font-weight:800;letter-spacing:.16em;color:#8a6b12}
h1{margin:12px 0 0;font-size:clamp(28px,5vw,40px);line-height:1.15;color:var(--lacivert)}
p{margin:16px 0 0;font-size:17px;line-height:1.65;color:var(--soluk)}
.durum{margin-top:24px;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--zemin);border:1px solid var(--kenar);border-radius:6px;font-size:15px;font-weight:600;color:var(--metin)}
.durum b{width:9px;height:9px;border-radius:50%;background:#e0a100;flex:none}
.islem{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:8px;font-weight:800;font-size:15px;text-decoration:none;color:#fff;background:var(--lacivert);border:2px solid var(--altin);box-shadow:0 8px 18px rgba(7,27,51,.14)}
.alt{padding:18px 0;text-align:center;font-size:13px;color:var(--soluk)}
@media(max-width:560px){.kutu{padding:28px 20px 24px}.urun{display:none}.btn{width:100%}}
</style>
</head>
<body>
<main class="ana">
  <section class="kutu">
    <div class="etiket">PLANLI BAKIM</div>
    <h1>Sunucularımızda bakım çalışması var.</h1>
    <p>Sistem bugün gün içinde yeniden hizmette olacaktır. Bakım tamamlanınca her zamanki adresinizden girebilirsiniz.</p>
    <p>13 yıldır size kesintisiz destek veriyoruz. Anlayışınız için teşekkür ederiz.</p>
    <div class="durum"><b></b>Bakım sürüyor.</div>
  </section>
</main>
</body>
</html>
